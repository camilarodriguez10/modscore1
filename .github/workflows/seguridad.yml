name: seguridad

# Escaneos que corren en cada push y cada PR, sin filtro de rutas: un secreto puede
# llegar en un documento y una dependencia vulnerable en cualquier lock file. Los builds,
# las pruebas y CodeQL estan en ci.yml, que se salta los cambios solo de documentacion.

on:
  push:
    branches: [main]
  pull_request:

# Minimo privilegio: el token del workflow solo lee.
permissions:
  contents: read

concurrency:
  group: seguridad-${{ github.ref }}
  cancel-in-progress: true

# Toda accion va fijada por SHA de commit, no por etiqueta. Renovate mantiene los SHA al dia.

jobs:
  secretos:
    name: Escaneo de secretos
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Todo el historial, no solo el ultimo commit: un secreto borrado en un commit
      # posterior sigue expuesto en los anteriores.
      - name: Gitleaks
        run: |
          docker run --rm \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            -v "$PWD:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --config /repo/.gitleaks.toml --redact --exit-code 1

  osv:
    name: OSV-Scanner
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Segunda opinion sobre npm y NuGet con la base de datos de OSV.
      - uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: |-
            --recursive
            ./
