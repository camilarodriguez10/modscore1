name: ci

# Build, pruebas, CodeQL, imagenes e infraestructura. Los escaneos de secretos y de
# dependencias estan en seguridad.yml, que corre en cada push sin filtro de rutas.
#
# Un push o PR que solo cambia documentacion, los scripts historicos, el paquete portable
# o el estado local de data/ no dispara este workflow: no hay codigo que compilar ni
# analizar. Con proteccion de rama, un check requerido de este workflow queda esperando en
# un PR solo de documentacion (OP-04).

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "tools/sesiones/**"
      - "artifacts/**"
      - "data/history/**"
      - "data/*.db*"
      - ".claude/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "tools/sesiones/**"
      - "artifacts/**"
      - "data/history/**"
      - "data/*.db*"
      - ".claude/**"

# Minimo privilegio: el token del workflow solo lee. Cada job pide de forma explicita lo
# que necesita de mas.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

# Toda accion va fijada por SHA de commit, no por etiqueta: una etiqueta se puede
# mover a codigo malicioso, un SHA no. Renovate mantiene los SHA al dia.

jobs:
  backend:
    name: Backend .NET
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Cache de NuGet con clave en los lock files. Solo escriben en ella las corridas de
      # este repositorio privado (no hay pull_request_target) y la restauracion sigue en
      # modo bloqueado.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restaurar con el arbol de dependencias bloqueado
        run: dotnet restore ModernizationScore.slnx --locked-mode

      - name: Compilar (warnings como errores, NuGetAudit bloqueante)
        run: dotnet build ModernizationScore.slnx --no-restore --configuration Release

      - name: Tests
        run: dotnet test ModernizationScore.slnx --no-build --configuration Release

      - name: Paquetes vulnerables, incluidos los transitivos
        run: |
          dotnet list ModernizationScore.slnx package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -qi "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::Hay paquetes con vulnerabilidades conocidas."
            exit 1
          fi

      - name: SBOM CycloneDX
        run: |
          dotnet tool install --global CycloneDX --version 6.2.0
          dotnet CycloneDX src/system/Modernization.SystemApi/Modernization.SystemApi.csproj -o sbom -fn system-api.cdx.json -F Json
          dotnet CycloneDX src/channel/Modernization.ChannelApi/Modernization.ChannelApi.csproj -o sbom -fn channel-api.cdx.json -F Json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-backend
          path: sbom/

  frontend:
    name: SPA
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      - name: Instalar exactamente el lock, sin scripts de instalacion
        run: npm ci --ignore-scripts

      - name: Auditoria de dependencias
        run: npm audit --audit-level=moderate

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: El build no publica source maps ni recursos de terceros
        run: |
          if ls dist/assets/*.map >/dev/null 2>&1; then
            echo "::error::El build incluye source maps."
            exit 1
          fi
          if grep -rqiE "fonts\.googleapis|fonts\.gstatic" dist; then
            echo "::error::El build referencia recursos de terceros."
            exit 1
          fi

  # Punta a punta y accesibilidad (TD-04, TD-05). Levanta las dos capas y la SPA en el
  # runner y las recorre con Chromium: el Edge del equipo de desarrollo no existe aqui.
  e2e:
    name: SPA de punta a punta
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      - name: Instalar exactamente el lock, sin scripts de instalacion
        run: npm ci --ignore-scripts

      - name: Navegador de Playwright
        run: npx playwright install --with-deps chromium

      # Compilar antes de levantar: el primer dotnet run no tiene que caber en el
      # tiempo de espera del servidor de pruebas.
      - name: Compilar las dos capas
        run: dotnet build ../channel/Modernization.ChannelApi/Modernization.ChannelApi.csproj

      - name: Punta a punta y accesibilidad
        run: npm run test:e2e
        env:
          MODSCORE_E2E_CHANNEL: chromium

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-trazas
          path: src/web/test-results/
          if-no-files-found: ignore

  # Un repositorio privado sin GitHub Code Security no tiene code scanning: subir el SARIF
  # falla. El analisis corre igual, el SARIF queda como artefacto y el job falla si hay
  # hallazgos de severidad alta. Con Code Security activo se puede volver a upload: always
  # (y security-events: write) para verlos en la pestana Security.
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    # En repositorios privados la accion lee la corrida del workflow por el API de Actions
    # aunque no suba resultados: sin actions: read, analyze falla con "Resource not
    # accessible by integration".
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      # Solo lo que se despliega: la capa Channel arrastra por referencia los diez proyectos
      # de src/. Sin pruebas ni herramientas, y sin los analizadores de Roslyn, que ya exige
      # el job Backend; los generadores de codigo si corren.
      - if: matrix.language == 'csharp'
        name: Compilar para el analisis
        run: dotnet build src/channel/Modernization.ChannelApi/Modernization.ChannelApi.csproj --configuration Release -p:RunAnalyzers=false

      - uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: "/language:${{ matrix.language }}"
          upload: never
          output: sarif

      - name: Guardar el SARIF
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-${{ matrix.language }}
          path: sarif/
          if-no-files-found: ignore

      # Alta = nivel error o security-severity de 7 o mas, igual que el umbral de GitHub.
      - name: Sin hallazgos de severidad alta
        run: |
          python3 - "${{ matrix.language }}" <<'PY'
          import glob, json, os, sys

          language = sys.argv[1]
          paths = sorted(glob.glob("sarif/*.sarif"))
          if not paths:
              print("::error::CodeQL no dejo ningun SARIF.")
              sys.exit(1)

          total = 0
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              for path in paths:
                  with open(path, encoding="utf-8") as handle:
                      document = json.load(handle)
                  count = 0
                  for run in document.get("runs", []):
                      tool = run.get("tool", {})
                      rules = list(tool.get("driver", {}).get("rules", []))
                      for extension in tool.get("extensions", []):
                          rules.extend(extension.get("rules", []))
                      severity = {rule.get("id"): float(rule.get("properties", {}).get("security-severity", 0)) for rule in rules}
                      for result in run.get("results", []):
                          if result.get("level") == "error" or severity.get(result.get("ruleId"), 0) >= 7:
                              count += 1
                  line = f"{path}: {count} hallazgos de severidad alta"
                  print(line)
                  print(line, file=summary)
                  total += count

          if total:
              print(f"::error::CodeQL encontro {total} hallazgos de severidad alta. Detalle en el artefacto codeql-{language}.")
              sys.exit(1)
          PY

  # En paralelo con Backend y SPA: construir y escanear las imagenes no depende de las
  # pruebas, y la corrida falla igual si falla cualquier job.
  contenedores:
    name: Imagenes e infraestructura
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Construir imagenes
        run: |
          docker build -f deploy/docker/system-api.Dockerfile -t modscore/system-api:ci .
          docker build -f deploy/docker/channel-api.Dockerfile -t modscore/channel-api:ci .

      # La accion instala Trivy v0.70.0 por defecto, afectado por GHSA-mcj4-mphf-j9ff,
      # GHSA-q3fv-x8vg-qqm4 y GHSA-8rc5-4fr6-64pw (corregidos hasta v0.72.0). Se fija la
      # version del escaner, no solo la de la accion.
      - name: Trivy — system-api
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: modscore/system-api:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Trivy — channel-api
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: modscore/channel-api:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Checkov — manifiestos y Dockerfiles
        uses: bridgecrewio/checkov-action@a8664e3a0549367977f0cda990a34311835c87c0 # v12.3123.0
        with:
          directory: deploy
          framework: kubernetes,dockerfile
          quiet: true
          soft_fail: false

# Pendiente de la infraestructura de publicacion (docs/security/hallazgos.md, H-17):
# empujar las imagenes al registro, firmarlas con cosign keyless y generar la
# atestacion SLSA que verifica la admision del cluster. Sin registro no hay donde
# publicar, y un paso que no puede correr no se deja escrito como si protegiera.
